<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{margin:12px;background:#e7dfc9;font:14px system-ui}section{display:grid;grid-template-columns:repeat(4,320px);width:max-content;gap:8px}article{padding:8px;background:#f8efdd}h3{margin:4px}canvas{background:#d8c5a7;display:block;width:320px;height:260px}</style><div id="gallery"></div><script type="module">
import {HOUSE_ITEMS,size,project,AREAS,spritePose} from './house-layout.mjs?v=20261019-whole3';import {scanAtlas,spriteIndex,registeredSprite,drawRegisteredSprite} from './sprite-geometry.mjs?v=20261019-whole3';
import {catalog} from './model.mjs';
const all=[...HOUSE_ITEMS,...catalog.filter(d=>['wardrobe','table','sofa','coffee-table'].includes(d.id)).map(d=>({...d,id:d.id,asset:d.id,terrace:true,name:'테라스 '+d.name}))];
window.audit=[];for(const d of all){const existing=d.terrace||['plant','bookshelf','chair'].includes(d.asset),im=new Image();im.src=`assets/${existing?'furniture':'house'}/${d.asset==='coffee-table'&&!d.terrace?'coffee-table-contact':d.asset}-4dir.png`;await im.decode();const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const cx=c.getContext('2d');cx.drawImage(im,0,0);const fs=scanAtlas(cx.getImageData(0,0,c.width,c.height).data,c.width,c.height),section=document.createElement('section');section.id=d.id;document.querySelector('#gallery').append(section);for(let rotation=0;rotation<4;rotation++){const f=fs[spriteIndex(d.id,rotation)],[w,h]=rotation%2?[d.h,d.w]:[d.w,d.h],tx=Math.min(30,230/(w+h)),ty=tx*Number(new URLSearchParams(location.search).get("ratio")||.60923),px=160-(h-w)*tx/2,py=210-(w+h)*ty/2,quad=[[0,0],[w,0],[w,h],[0,h]].map(([x,y])=>({x:px+(y-x)*tx,y:py+(x+y)*ty})),pose=registeredSprite(d.id,f,quad),el=document.createElement('article'),label=document.createElement('h3');label.textContent=d.name+' · '+rotation;const out=document.createElement('canvas');out.width=320;out.height=260;el.append(label,out);section.append(el);const ctx=out.getContext('2d'),maxY=Math.max(260,pose.box.y+pose.box.h+8),minY=Math.min(0,pose.box.y-8),scale=Math.min(1,240/(maxY-minY));ctx.translate(160,130);ctx.scale(scale,scale);ctx.translate(-160,-(maxY+minY)/2);ctx.beginPath();quad.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle='#7ba97f77';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();drawRegisteredSprite(ctx,im,f,pose);window.audit.push({id:d.id,rotation,index:spriteIndex(d.id,rotation),ground:f.ground,quad,parts:pose.parts,frame:f})}}window.auditReady=true;
